name: brew test-bot

on:
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae

      - name: Install and test AgenC
        shell: bash
        run: |
          set -euo pipefail
          brew uninstall --formula --force tetsuo-ai/agenc/agenc 2>/dev/null || true
          brew install --formula tetsuo-ai/agenc/agenc
          brew test tetsuo-ai/agenc/agenc
